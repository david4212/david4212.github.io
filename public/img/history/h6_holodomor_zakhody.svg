<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="420" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Заходи радянської влади в Україні 1932–1933 рр. (схема)</text><rect x="60" y="42" width="520" height="62" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="82.0" cy="73.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="78.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="104" y="69.0" font-size="13" fill="#1e293b">7 серпня 1932 р. — закон про охорону соціалістичної власності</text><text x="104" y="85.0" font-size="13" fill="#1e293b">(«закон про п'ять колосків»: суворі покарання за «розкрадання»)</text><line x1="320" y1="104" x2="320" y2="122" stroke="#475569" stroke-width="2"/><polygon points="315,120 325,120 320,128" fill="#475569"/><rect x="60" y="128" width="520" height="62" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="82.0" cy="159.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="164.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="104" y="155.0" font-size="13" fill="#1e293b">Листопад 1932 р. — занесення сіл на «чорні дошки»</text><text x="104" y="171.0" font-size="13" fill="#1e293b">(заборона торгівлі, вивіз товарів, штрафи)</text><line x1="320" y1="190" x2="320" y2="208" stroke="#475569" stroke-width="2"/><polygon points="315,206 325,206 320,214" fill="#475569"/><rect x="60" y="214" width="520" height="62" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="82.0" cy="245.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="250.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="104" y="241.0" font-size="13" fill="#1e293b">Листопад 1932 р. — натуральні штрафи й вилучення продуктів</text><text x="104" y="257.0" font-size="13" fill="#1e293b">(м'ясо, картопля, квасоля, все збіжжя)</text><line x1="320" y1="276" x2="320" y2="294" stroke="#475569" stroke-width="2"/><polygon points="315,292 325,292 320,300" fill="#475569"/><rect x="60" y="300" width="520" height="62" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="82.0" cy="331.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="336.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="104" y="327.0" font-size="13" fill="#1e293b">22 січня 1933 р. — директива про заборону виїзду селян</text><text x="104" y="343.0" font-size="13" fill="#1e293b">(з України й Кубані до інших районів)</text><text x="320" y="394" text-anchor="middle" font-size="12" fill="#64748b">Голодомор 1932–1933 рр. — штучний голод, визнаний геноцидом українського народу</text></svg>