<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="400" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Вимоги студентів у жовтні 1990 р. («Революція на граніті»)</text><rect x="40" y="44" width="560" height="56" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="62.0" cy="72.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="77.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="84" y="76.0" font-size="13" fill="#1e293b">відставка голови Ради міністрів Віталія Масола</text><rect x="40" y="110" width="560" height="56" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="62.0" cy="138.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="143.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="84" y="142.0" font-size="13" fill="#1e293b">нові вибори до Верховної Ради на багатопартійній основі (навесні 1991 р.)</text><rect x="40" y="176" width="560" height="56" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="62.0" cy="204.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="209.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="84" y="208.0" font-size="13" fill="#1e293b">відмова від підписання нового Союзного договору</text><rect x="40" y="242" width="560" height="56" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="62.0" cy="270.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="84" y="274.0" font-size="13" fill="#1e293b">націоналізація майна КПУ та ЛКСМУ</text><rect x="40" y="308" width="560" height="56" rx="8" fill="#e0e7ff" stroke="#475569"/><circle cx="62.0" cy="336.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="341.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><text x="84" y="340.0" font-size="13" fill="#1e293b">військова служба українців лише на території України</text></svg>