<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" width="640" height="366" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="366" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Україна в роки Другої світової війни (хронологія)</text><line x1="44" y1="59" x2="44" y2="89" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="59.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="64.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><rect x="80" y="45" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">23 серпня 1939 р.</text><text x="244" y="64" font-size="14" fill="#1e293b">Пакт Молотова — Ріббентропа</text><line x1="44" y1="103" x2="44" y2="133" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="103.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="108.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><rect x="80" y="89" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">17 вересня 1939 р.</text><text x="244" y="108" font-size="14" fill="#1e293b">Червона армія входить у Західну Україну</text><line x1="44" y1="147" x2="44" y2="177" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="147.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="152.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><rect x="80" y="133" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">22 червня 1941 р.</text><text x="244" y="152" font-size="14" fill="#1e293b">Напад Німеччини на СРСР</text><line x1="44" y1="191" x2="44" y2="221" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="19