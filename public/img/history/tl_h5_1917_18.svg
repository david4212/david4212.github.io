<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="322" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Українська Центральна Рада (хронологія 1917–1918)</text><line x1="44" y1="59" x2="44" y2="89" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="59.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="64.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><rect x="80" y="45" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">березень 1917</text><text x="244" y="64" font-size="14" fill="#1e293b">Створення Української Центральної Ради</text><line x1="44" y1="103" x2="44" y2="133" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="103.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="108.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><rect x="80" y="89" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">23 червня 1917</text><text x="244" y="108" font-size="14" fill="#1e293b">I Універсал</text><line x1="44" y1="147" x2="44" y2="177" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="147.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="152.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><rect x="80" y="133" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">16 липня 1917</text><text x="244" y="152" font-size="14" fill="#1e293b">II Універсал</text><line x1="44" y1="191" x2="44" y2="221" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="191.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="196.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><rect x="80" y="177" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">20 листопада 1917</text><text x="244" y="196" font-size="14" fill="#1e293b">III Універсал: проголошення УНР</text><line x1="44" y1="235" x2="44" y2="265" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="235.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="240.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><rect x="80" y="221" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">22 січня 1918</text><text x="244" y="240" font-size="14" fill="#1e293b">IV Універсал</text><circle cx="44.0" cy="279.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="284.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">6</text><rect x="80" y="265" width="150" height="28" rx="6" fill="#3b82f6"/><text x="155" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">9 лютого 1918</text><text x="244" y="284" font-size="14" fill="#1e293b">Берестейський мир</text></svg>