<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="330" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Українське відродження XIX ст. (стрічка)</text><line x1="44" y1="69" x2="44" y2="99" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="69.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="74.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><rect x="80" y="55" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1798</text><text x="162" y="74" font-size="14" fill="#1e293b">«Енеїда» Івана Котляревського</text><line x1="44" y1="113" x2="44" y2="143" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="113.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="118.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><rect x="80" y="99" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1837</text><text x="162" y="118" font-size="14" fill="#1e293b">«Русалка Дністровая» (Львів)</text><line x1="44" y1="157" x2="44" y2="187" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="157.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="162.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><rect x="80" y="143" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1840</text><text x="162" y="162" font-size="14" fill="#1e293b">«Кобзар» Тараса Шевченка</text><line x1="44" y1="201" x2="44" y2="231" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="201.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="206.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><rect x="80" y="187" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1845</text><text x="162" y="206" font-size="14" fill="#1e293b">Кирило-Мефодіївське братство (1845–1847)</text><line x1="44" y1="245" x2="44" y2="275" stroke="#94a3b8" stroke-width="3"/><circle cx="44.0" cy="245.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="250.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><rect x="80" y="231" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1863</text><text x="162" y="250" font-size="14" fill="#1e293b">Валуєвський циркуляр</text><circle cx="44.0" cy="289.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="44.0" y="294.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">6</text><rect x="80" y="275" width="70" height="28" rx="6" fill="#3b82f6"/><text x="115" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1876</text><text x="162" y="294" font-size="14" fill="#1e293b">Емський указ</text></svg>