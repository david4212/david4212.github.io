<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="420" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Ключові кроки 1990–1991 рр. (схема)</text><rect x="60" y="42" width="520" height="56" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="82.0" cy="70.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="75.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="104" y="66.0" font-size="13" fill="#1e293b">16 липня 1990 р. — Декларація про державний суверенітет України</text><text x="104" y="82.0" font-size="13" fill="#1e293b">(Верховна Рада УРСР)</text><line x1="320" y1="98" x2="320" y2="112" stroke="#475569" stroke-width="2"/><polygon points="315,110 325,110 320,118" fill="#475569"/><rect x="60" y="118" width="520" height="56" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="82.0" cy="146.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="151.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="104" y="142.0" font-size="13" fill="#1e293b">19–21 серпня 1991 р. — спроба державного перевороту в Москві</text><text x="104" y="158.0" font-size="13" fill="#1e293b">(ГКЧП проти Горбачова)</text><line x1="320" y1="174" x2="320" y2="188" stroke="#475569" stroke-width="2"/><polygon points="315,186 325,186 320,194" fill="#475569"/><rect x="60" y="194" width="520" height="56" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="82.0" cy="222.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="227.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="104" y="218.0" font-size="13" fill="#1e293b">24 серпня 1991 р. — Акт проголошення незалежності України</text><text x="104" y="234.0" font-size="13" fill="#1e293b">(Верховна Рада УРСР)</text><line x1="320" y1="250" x2="320" y2="264" stroke="#475569" stroke-width="2"/><polygon points="315,262 325,262 320,270" fill="#475569"/><rect x="60" y="270" width="520" height="56" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="82.0" cy="298.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="303.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="104" y="294.0" font-size="13" fill="#1e293b">1 грудня 1991 р. — референдум і вибори Президента</text><text x="104" y="310.0" font-size="13" fill="#1e293b">(Леонід Кравчук)</text><line x1="320" y1="326" x2="320" y2="340" stroke="#475569" stroke-width="2"/><polygon points="315,338 325,338 320,346" fill="#475569"/><rect x="60" y="346" width="520" height="56" rx="8" fill="#e0e7ff" stroke="#475569"/><circle cx="82.0" cy="374.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="379.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><text x="104" y="370.0" font-size="13" fill="#1e293b">26 грудня 1991 р. — припинення існування СРСР</text><text x="104" y="386.0" font-size="13" fill="#1e293b">(остаточне закріплення розпаду)</text></svg>