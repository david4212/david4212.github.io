<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="330" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Устрій Запорозької Січі (схема)</text><rect x="70" y="40" width="500" height="56" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="92.0" cy="68.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="92.0" y="73.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="114" y="64.0" font-size="13" fill="#1e293b">Вирішує питання війни й миру,</text><text x="114" y="80.0" font-size="13" fill="#1e293b">обирає всю старшину Січі</text><line x1="320" y1="96" x2="320" y2="106" stroke="#475569" stroke-width="2"/><polygon points="315,104 325,104 320,112" fill="#475569"/><rect x="70" y="112" width="500" height="56" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="92.0" cy="140.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="92.0" y="145.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="114" y="136.0" font-size="13" fill="#1e293b">Кошовий отаман, військовий суддя,</text><text x="114" y="152.0" font-size="13" fill="#1e293b">військовий писар, військовий осавул</text><line x1="320" y1="168" x2="320" y2="178" stroke="#475569" stroke-width="2"/><polygon points="315,176 325,176 320,184" fill="#475569"/><rect x="70" y="184" width="500" height="56" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="92.0" cy="212.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="92.0" y="217.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="114" y="208.0" font-size="13" fill="#1e293b">Територіальні військово-адміністративні округи</text><text x="114" y="224.0" font-size="13" fill="#1e293b">Запорожжя на чолі з полковниками</text><line x1="320" y1="240" x2="320" y2="250" stroke="#475569" stroke-width="2"/><polygon points="315,248 325,248 320,256" fill="#475569"/><rect x="70" y="256" width="500" height="56" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="92.0" cy="284.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="92.0" y="289.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="114" y="280.0" font-size="13" fill="#1e293b">Військово-господарські громади запорожців</text><text x="114" y="296.0" font-size="13" fill="#1e293b">(38 одиниць у Новій Січі)</text></svg>