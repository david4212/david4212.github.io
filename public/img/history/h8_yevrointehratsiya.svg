<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="430" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Шлях України до Європейського Союзу (схема)</text><rect x="40" y="42" width="560" height="58" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="62.0" cy="71.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="76.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="84" y="75.0" font-size="13" fill="#1e293b">1995 р. — вступ до Ради Європи</text><line x1="320" y1="100" x2="320" y2="112" stroke="#475569" stroke-width="2"/><polygon points="315,110 325,110 320,118" fill="#475569"/><rect x="40" y="118" width="560" height="58" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="62.0" cy="147.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="152.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="84" y="151.0" font-size="13" fill="#1e293b">1998 р. — чинна Угода про партнерство і співробітництво з ЄС</text><line x1="320" y1="176" x2="320" y2="188" stroke="#475569" stroke-width="2"/><polygon points="315,186 325,186 320,194" fill="#475569"/><rect x="40" y="194" width="560" height="58" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="62.0" cy="223.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="228.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="84" y="227.0" font-size="13" fill="#1e293b">2014 р. — підписано Угоду про асоціацію (чинна з 1.09.2017)</text><line x1="320" y1="252" x2="320" y2="264" stroke="#475569" stroke-width="2"/><polygon points="315,262 325,262 320,270" fill="#475569"/><rect x="40" y="270" width="560" height="58" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="62.0" cy="299.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="304.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="84" y="303.0" font-size="13" fill="#1e293b">2017 р. — безвізовий режим для громадян України</text><line x1="320" y1="328" x2="320" y2="340" stroke="#475569" stroke-width="2"/><polygon points="315,338 325,338 320,346" fill="#475569"/><rect x="40" y="346" width="560" height="58" rx="8" fill="#e0e7ff" stroke="#475569"/><circle cx="62.0" cy="375.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="62.0" y="380.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><text x="84" y="379.0" font-size="13" fill="#1e293b">2022 р. — статус кандидата в ЄС; 2024 р. — початок переговорів</text></svg>