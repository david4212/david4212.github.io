<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" font-family="Arial,Helvetica,sans-serif"><rect width="640" height="370" fill="#fff"/><text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Державна влада за Конституцією України 1996 р. (схема)</text><rect x="60" y="40" width="520" height="52" rx="8" fill="#fef3c7" stroke="#475569"/><circle cx="82.0" cy="66.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="71.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><text x="104" y="70.0" font-size="13" fill="#1e293b">Президент України — глава держави, гарант Конституції</text><rect x="60" y="108" width="520" height="52" rx="8" fill="#dbeafe" stroke="#475569"/><circle cx="82.0" cy="134.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="139.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><text x="104" y="138.0" font-size="13" fill="#1e293b">Верховна Рада — єдиний орган законодавчої влади (450)</text><rect x="60" y="176" width="520" height="52" rx="8" fill="#dcfce7" stroke="#475569"/><circle cx="82.0" cy="202.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="207.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><text x="104" y="206.0" font-size="13" fill="#1e293b">Кабінет Міністрів — вищий орган виконавчої влади</text><rect x="60" y="244" width="520" height="52" rx="8" fill="#fce7f3" stroke="#475569"/><circle cx="82.0" cy="270.0" r="12" fill="#1e293b" stroke="#fff" stroke-width="1.5"/><text x="82.0" y="275.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4</text><text x="104" y="274.0" font-size="13" fill="#1e293b">Судова влада: Верховний Суд, Конституційний Суд</text><text x="320" y="326" text-anchor="middle" font-size="12" fill="#64748b">Конституцію прийнято 28 червня 1996 р. (День Конституції)</text></svg>