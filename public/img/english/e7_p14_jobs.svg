<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" width="720" height="386" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="718" height="384" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="0" y="0" width="720" height="54" rx="10" fill="#7c3aed"/><rect x="0" y="30" width="720" height="24" fill="#7c3aed"/><text x="360.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >Five people talk about their work</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Ivan</text><text x="22" y="105.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I work in a hospital, but I am not a doctor. I help patients to move and walk again</text><text x="22" y="126.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >after operations.</text><text x="22" y="153.5" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Olga</text><text x="22" y="176.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I spend most of my day outdoors. I plant trees and look after the flowers in the city</text><text x="22" y="197.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >park.</text><text x="22" y="224.0" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Max</text><text x="22" y="246.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I travel a lot. I check the engines of planes before they take off.</text><text x="22" y="273.5" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Lena</text><text x="22" y="296.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I work from home. I design websites for small companies and talk to my clients online.</text><text x="22" y="323.0" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Petro</text><text x="22" y="345.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I work in a school canteen. Every day I prepare meals for three hundred children.</text></svg>