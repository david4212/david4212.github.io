<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 229" width="560" height="229" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="558" height="227" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><rect x="0" y="0" width="560" height="54" rx="10" fill="#059669"/><rect x="0" y="30" width="560" height="24" fill="#059669"/><text x="280.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >BEACH CLEAN-UP DAY</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Saturday 15 June · 9 a.m.</text><text x="22" y="108.0" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Meet at the main entrance of the beach. Bring gloves and a</text><text x="22" y="130.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >bottle of water — bags will be provided.</text><text x="22" y="158.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Free lunch for all volunteers!</text><text x="22" y="187.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Organised by the Green School Club.</text></svg>