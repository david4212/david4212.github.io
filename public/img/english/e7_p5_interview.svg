<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 355" width="720" height="355" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="718" height="353" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/><rect x="0" y="0" width="720" height="54" rx="10" fill="#be123c"/><rect x="0" y="30" width="720" height="24" fill="#be123c"/><text x="360.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >Interview · A young volunteer</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Interviewer: How long have you been a volunteer?</text><text x="22" y="110.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Danylo: For two years. I started when my school organised a day at an animal shelter.</text><text x="22" y="137.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Interviewer: What exactly do you do?</text><text x="22" y="164.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Danylo: I walk the dogs, clean the cages and help to find new owners for the animals.</text><text x="22" y="185.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Last month I also made a poster for our adoption day.</text><text x="22" y="212.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Interviewer: Is it hard work?</text><text x="22" y="239.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Danylo: Sometimes. In winter it is cold and the shelter is always full. But when a dog</text><text x="22" y="260.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >finds a family, I feel really proud.</text><text x="22" y="287.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Interviewer: What would you say to teenagers who are thinking about volunteering?</text><text x="22" y="314.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Danylo: Just try it. You do not need special skills, only patience and time.</text></svg>