<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 256" width="600" height="256" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="254" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><rect x="0" y="0" width="600" height="54" rx="10" fill="#c2410c"/><rect x="0" y="30" width="600" height="24" fill="#c2410c"/><text x="300.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >HAND LUGGAGE RULES</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >1. One bag only. Maximum weight: 7 kg.</text><text x="22" y="112.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >2. Liquids must be in containers of up to 100 ml and kept in a</text><text x="22" y="134.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >clear plastic bag.</text><text x="22" y="163.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >3. Laptops must be taken out of the bag at security.</text><text x="22" y="191.60000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >4. Sharp objects are not allowed. Large suitcases must go in the</text><text x="22" y="214.00000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >hold.</text></svg>