<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Arial,Helvetica,sans-serif"><rect width="560" height="360" fill="#f1f5f9"/><rect x="20" y="14" width="400" height="56" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="34" y="34" font-size="13" fill="#475569" font-weight="bold" text-anchor="start" >Ivan</text><text x="34" y="56" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Did you finish revising for the history exam?</text><rect x="140" y="82" width="400" height="56" rx="14" fill="#bbf7d0" stroke="#94a3b8"/><text x="154" y="102" font-size="13" fill="#475569" font-weight="bold" text-anchor="start" >Olya</text><text x="154" y="124" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Not yet. I am still reading chapter 5.</text><rect x="20" y="150" width="400" height="56" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="34" y="170" font-size="13" fill="#475569" font-weight="bold" text-anchor="start" >Ivan</text><text x="34" y="192" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Hurry up! It is tomorrow at 9.</text><rect x="140" y="218" width="400" height="56" rx="14" fill="#bbf7d0" stroke="#94a3b8"/><text x="154" y="238" font-size="13" fill="#475569" font-weight="bold" text-anchor="start" >Olya</text><text x="154" y="260" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >I know. I will burn the midnight oil tonight!</text><rect x="20" y="286" width="400" height="56" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="34" y="306" font-size="13" fill="#475569" font-weight="bold" text-anchor="start" >Ivan</text><text x="34" y="328" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Good luck! See you at 8:30 near the entrance.</text></svg>