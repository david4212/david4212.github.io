<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" width="620" height="370" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="618" height="368" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/><rect x="0" y="0" width="620" height="54" rx="10" fill="#1e3a8a"/><rect x="0" y="30" width="620" height="24" fill="#1e3a8a"/><text x="310.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >Email · Admissions Office</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >From: admissions@greenfield.ac.uk To: Maria Ivanova</text><text x="22" y="110.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Subject: Merit Scholarship — result</text><text x="22" y="137.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Dear Maria,</text><text x="22" y="164.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >We are pleased to inform you that your application for the Merit</text><text x="22" y="185.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Scholarship has been successful. The scholarship will cover half of your</text><text x="22" y="206.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >tuition fees for the first year of your degree.</text><text x="22" y="233.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >To accept the offer, please sign the attached form and return it to us by</text><text x="22" y="254.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >30 June. If we do not hear from you by that date, the scholarship may be</text><text x="22" y="275.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >offered to another candidate.</text><text x="22" y="302.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Yours sincerely,</text><text x="22" y="329.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Dr Helen Moore, Admissions Office</text></svg>