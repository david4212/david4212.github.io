<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 304" width="580" height="304" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="578" height="302" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="0" y="0" width="580" height="54" rx="10" fill="#ea580c"/><rect x="0" y="30" width="580" height="24" fill="#ea580c"/><text x="290.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >WE NEED YOU! · Café Sunrise</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Part-time waiter / waitress</text><text x="22" y="108.0" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Working hours: Friday to Sunday, 4 p.m. – 10 p.m.</text><text x="22" y="136.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Pay: £9 an hour</text><text x="22" y="164.8" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Requirements</text><text x="22" y="188.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >You must be 16 or older, friendly, and able to speak some</text><text x="22" y="211.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >English. Experience is not necessary — full training is</text><text x="22" y="233.60000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >provided.</text><text x="22" y="262.0" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Please send your CV to jobs@sunrise.com by 20 May.</text></svg>