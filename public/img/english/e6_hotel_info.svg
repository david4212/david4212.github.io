<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="328" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/><rect x="0" y="0" width="600" height="54" rx="10" fill="#a16207"/><rect x="0" y="30" width="600" height="24" fill="#a16207"/><text x="300.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >HOTEL PANORAMA · Guest information</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Breakfast</text><text x="22" y="108.0" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >7:00 – 10:30 in the restaurant on the ground floor.</text><text x="22" y="136.4" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Check-out</text><text x="22" y="160.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Please leave your room before 11:00. Late check-out until 14:00</text><text x="22" y="182.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >costs £10.</text><text x="22" y="211.20000000000002" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Wi-Fi</text><text x="22" y="235.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Free in all rooms. Ask at reception for the password.</text><text x="22" y="263.6" font-size="16" fill="#1e293b" font-weight="bold" text-anchor="start" >Swimming pool</text><text x="22" y="287.6" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Open 8:00 – 21:00. Children under 12 must be with an adult.</text></svg>