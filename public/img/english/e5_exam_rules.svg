<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 262" width="580" height="262" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="578" height="260" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><rect x="0" y="0" width="580" height="54" rx="10" fill="#b91c1c"/><rect x="0" y="30" width="580" height="24" fill="#b91c1c"/><text x="290.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >EXAM RULES</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >1. Arrive at least 15 minutes before the exam begins.</text><text x="22" y="112.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >2. Switch off your mobile phone and put it in your bag.</text><text x="22" y="140.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >3. Do not talk during the exam.</text><text x="22" y="169.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >4. You may leave the room after 45 minutes, but not before.</text><text x="22" y="197.60000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >5. Bring a pen, a pencil and a ruler. Dictionaries are not</text><text x="22" y="220.00000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >allowed.</text></svg>