<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 307" width="600" height="307" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="305" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="0" y="0" width="600" height="54" rx="10" fill="#d97706"/><rect x="0" y="30" width="600" height="24" fill="#d97706"/><text x="300.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >Postcard from Batumi</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Dear Anna,</text><text x="22" y="112.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Greetings from Batumi! We arrived on Sunday after a long flight.</text><text x="22" y="134.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Our hotel is right on the beach, and our room has a wonderful view</text><text x="22" y="157.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >of the sea. The weather is hot and sunny — about 32 degrees.</text><text x="22" y="185.60000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Yesterday we went on an excursion to the mountains, and tomorrow</text><text x="22" y="208.00000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >we are going to hire bicycles. We fly home on Saturday.</text><text x="22" y="236.40000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Wish you were here!</text><text x="22" y="264.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Love, Dima</text></svg>