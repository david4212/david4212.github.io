<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" width="600" height="278" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="598" height="276" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><rect x="0" y="0" width="600" height="54" rx="10" fill="#d97706"/><rect x="0" y="30" width="600" height="24" fill="#d97706"/><text x="300.0" y="35" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle" >Housewarming party!</text><text x="22" y="84" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >From: Olga Petrenko To: All friends</text><text x="22" y="112.4" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Hi everyone! We have finally moved into our new flat at 25 Green</text><text x="22" y="134.8" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Street, and we would love to invite you to a housewarming party on</text><text x="22" y="157.20000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Saturday, 12 October, at 6 p.m.</text><text x="22" y="185.60000000000002" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Please bring a drink or a snack to share. The nearest metro</text><text x="22" y="208.00000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >station is Central Park, then it is a five-minute walk.</text><text x="22" y="236.40000000000003" font-size="16" fill="#1e293b" font-weight="normal" text-anchor="start" >Please let me know by Wednesday if you can come. Olga</text></svg>