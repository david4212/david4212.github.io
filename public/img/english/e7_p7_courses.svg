<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" width="720" height="314" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="718" height="312" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="0" y="0" width="720" height="54" rx="10" fill="#ea580c"/><rect x="0" y="30" width="720" height="24" fill="#ea580c"/><text x="360.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >SUNSHINE LANGUAGE SCHOOL · Our courses</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Course A: Evening English</text><text x="22" y="105.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Monday and Wednesday, 6:00 – 7:30 p.m. · £120 a month · for adults who work during the</text><text x="22" y="126.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >day.</text><text x="22" y="153.5" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Course B: Intensive Summer English</text><text x="22" y="176.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Monday to Friday, 9:00 a.m. – 1:00 p.m., 1 – 28 July · £400 · lunch and two trips</text><text x="22" y="197.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >included.</text><text x="22" y="224.0" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Course C: Online Conversation Club</text><text x="22" y="246.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Saturdays, 10:00 – 11:00 a.m. · £30 a month · small groups of six students.</text><text x="22" y="273.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Students under 18 get 15% off any course.</text></svg>