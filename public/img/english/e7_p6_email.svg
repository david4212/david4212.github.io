<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 379" width="720" height="379" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="718" height="377" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="0" y="0" width="720" height="54" rx="10" fill="#0e7490"/><rect x="0" y="30" width="720" height="24" fill="#0e7490"/><text x="360.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >Email · From Julia to Kate</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Hi Kate!</text><text x="22" y="110.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Thanks for your message — I was so glad to hear from you! I'm having a great time in</text><text x="22" y="131.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Bristol. My host family is lovely, and their daughter Emma is only a year older than</text><text x="22" y="152.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >me, so we have a lot in common. School is quite different from home: we wear uniforms,</text><text x="22" y="173.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >and lessons finish at 3:30.</text><text x="22" y="200.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Anyway, I have some news! My host family is going to the seaside on the second weekend</text><text x="22" y="221.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >of June, and they have invited you to come with us. We will leave on Friday after</text><text x="22" y="242.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >school and come back on Sunday evening. It will cost nothing, because Emma's parents</text><text x="22" y="263.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >have a holiday cottage there. Please don't forget to bring a swimming costume and a</text><text x="22" y="284.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >warm jacket — the water is freezing even in summer!</text><text x="22" y="311.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Let me know as soon as possible, so that Emma's mum can plan everything.</text><text x="22" y="338.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Love, Julia</text></svg>