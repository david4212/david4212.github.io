<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="Arial,Helvetica,sans-serif"><rect width="520" height="330" rx="16" fill="#e2e8f0"/><rect x="16" y="14" width="380" height="60" rx="12" fill="#fff"/><text x="28" y="31" font-size="12" fill="#64748b" font-weight="bold" text-anchor="start" >Mum</text><text x="28" y="47" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Hi Anna! Can you buy some bread and milk</text><text x="28" y="64" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >after school?</text><rect x="124" y="84" width="380" height="40" rx="12" fill="#bbf7d0"/><text x="136" y="101" font-size="12" fill="#64748b" font-weight="bold" text-anchor="start" >Anna</text><text x="136" y="117" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Sure. Shall I get anything else?</text><rect x="16" y="134" width="380" height="60" rx="12" fill="#fff"/><text x="28" y="151" font-size="12" fill="#64748b" font-weight="bold" text-anchor="start" >Mum</text><text x="28" y="167" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Yes, a cake for Granny's birthday. I'll pay</text><text x="28" y="184" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >you back tonight.</text><rect x="124" y="204" width="380" height="60" rx="12" fill="#bbf7d0"/><text x="136" y="221" font-size="12" fill="#64748b" font-weight="bold" text-anchor="start" >Anna</text><text x="136" y="237" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >OK. I'm staying at school until 4 for the</text><text x="136" y="254" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >club.</text><rect x="16" y="274" width="380" height="40" rx="12" fill="#fff"/><text x="28" y="291" font-size="12" fill="#64748b" font-weight="bold" text-anchor="start" >Mum</text><text x="28" y="307" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >No problem. Dad will pick you up at 5.</text></svg>