<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="718" height="348" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="0" y="0" width="720" height="54" rx="10" fill="#15803d"/><rect x="0" y="30" width="720" height="24" fill="#15803d"/><text x="360.0" y="35" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle" >GREEN VALLEY SUMMER CAMP · 10–15 July · ages 12–16</text><text x="22" y="83" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Price: 3,500 UAH</text><text x="22" y="105.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >Includes accommodation, meals and excursions. Early booking until 1 June: 10%</text><text x="22" y="126.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >discount.</text><text x="22" y="153.5" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Daily programme</text><text x="22" y="176.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >7:30 wake-up and morning exercise · 8:00 breakfast · 9:00 – 12:00 workshops</text><text x="22" y="197.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >(photography, theatre or robotics — choose one) · 12:30 lunch · 14:00 – 16:00 outdoor</text><text x="22" y="218.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >games or swimming · 16:30 free time · 19:00 dinner · 20:00 campfire songs · 22:00</text><text x="22" y="239.0" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >lights out</text><text x="22" y="266.0" font-size="15" fill="#1e293b" font-weight="bold" text-anchor="start" >Please bring</text><text x="22" y="288.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >a sleeping bag, a torch, a swimsuit, comfortable shoes and a rain jacket. Mobile</text><text x="22" y="309.5" font-size="15" fill="#1e293b" font-weight="normal" text-anchor="start" >phones may be used only during free time.</text></svg>